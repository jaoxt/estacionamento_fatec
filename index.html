<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parkly – Protótipo de Estacionamento</title>
  <style>
    :root {
      --r1: #0a2540;
      --r2: #1e5fbf;
      --r3: #3b82f6;
      --r4: #eaf2fd;
      --bg: #fff;
      --tx: #14233b;
      --card: #fff;
      --bd: #dbe6f5;
      --mut: #5f7189;
      --ok: #15803d;
      --warn: #d97706;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: #0a2540;
      z-index: 10;
    }

    body.auth::before {
      background: #fff;
    }

    .shell {
      display: flex;
      min-height: 100vh;
    }

    #side {
      width: 250px;
      flex: none;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      height: calc(100vh - env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, #0a2540, #124581);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 18px 12px;
      z-index: 5;
      overflow-y: auto;
    }

    body.auth #side {
      display: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px;
      font-size: 20px;
    }

    .logo {
      width: 34px;
      height: 34px;
      line-height: 34px;
      text-align: center;
      border-radius: 10px;
      background: linear-gradient(135deg, #60a5fa, #2563eb);
      font-weight: 700;
    }

    #side nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 26px;
    }

    #side button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: transparent;
      color: #cfe0f7;
      box-shadow: none;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 15px;
      border-left: 3px solid transparent;
    }

    #side button svg {
      width: 21px;
      height: 21px;
      flex: none;
      color: #7db4ff;
    }

    #side button:hover {
      background: rgba(255, 255, 255, .08);
      filter: none;
    }

    #side nav .on {
      background: rgba(59, 130, 246, .3);
      color: #fff;
      border-left-color: #60a5fa;
    }

    #side nav .on svg {
      color: #fff;
    }

    .foot {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, .14);
    }

    .who {
      padding: 0 6px 8px;
    }

    .who b {
      display: block;
    }

    .who small {
      display: block;
      color: #9db8dd;
      font-size: 12px;
    }

    .foot button {
      background: rgba(255, 255, 255, .08);
      margin-top: 6px;
      font-size: 14px;
    }

    main {
      flex: 1;
      min-width: 0;
      max-width: 1000px;
      margin: 0 auto;
      padding: 22px 20px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(10, 37, 64, .06);
    }

    h2 {
      margin: 0 0 12px;
      color: var(--r1);
      font-size: 17px;
      font-weight: 650;
    }

    button {
      background: linear-gradient(135deg, #3b82f6, #1e5fbf);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 550;
      cursor: pointer;
      min-height: 44px;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(30, 95, 191, .28);
    }

    button.g {
      background: var(--r4);
      color: var(--r2);
      border: 1px solid #bfd7f7;
      box-shadow: none;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active {
      transform: scale(.98);
    }

    input, select {
      padding: 11px 12px;
      border: 1px solid #c5d6ee;
      border-radius: 10px;
      background: #fff;
      color: var(--tx);
      font-size: 16px;
      width: 100%;
      margin: 4px 0 12px;
      font-family: inherit;
      min-height: 44px;
    }

    input:focus, select:focus {
      outline: 2px solid var(--r3);
      border-color: var(--r3);
    }

    label {
      font-size: 13px;
      color: var(--mut);
      font-weight: 500;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tabs button {
      background: var(--r4);
      color: var(--r2);
      border: 1px solid #bfd7f7;
      box-shadow: none;
    }

    .tabs .on {
      background: linear-gradient(135deg, #3b82f6, #1e5fbf);
      color: #fff;
      border-color: var(--r2);
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat {
      background: var(--r4);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: var(--mut);
      border-left: 4px solid var(--r3);
    }

    .stat b {
      font-size: 24px;
      color: var(--r2);
      display: block;
      line-height: 1.2;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
      gap: 7px;
    }

    .sp {
      border: 2px solid var(--bd);
      border-radius: 10px;
      text-align: center;
      padding: 6px 2px;
      cursor: pointer;
      font-size: 11.5px;
      min-height: 64px;
      background: #fff;
    }

    .sp b {
      display: block;
      font-size: 16px;
    }

    .sp small {
      display: block;
      color: var(--mut);
      font-size: 10px;
    }

    .sp.free {
      border-color: var(--ok);
      background: #f0fdf4;
    }

    .sp.occupied {
      background: var(--r2);
      color: #fff;
      border-color: var(--r2);
    }

    .sp.occupied small {
      color: #cfe0f7;
    }

    .sp.reserved {
      border: 2px dashed var(--warn);
      background: #fffbeb;
    }

    .sp.blocked {
      background: #94a3b8;
      color: #fff;
      border-color: #64748b;
    }

    .sp.blocked small {
      color: #fff;
    }

    .sp.sel {
      outline: 3px solid var(--r3);
      outline-offset: 1px;
      transform: scale(1.05);
    }

    .leg {
      font-size: 12px;
      color: var(--mut);
      margin: 10px 0 0;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .leg u {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 2px solid;
      margin-right: 5px;
      vertical-align: -2px;
    }

    .leg .free {
      border-color: var(--ok);
      background: #f0fdf4;
    }

    .leg .occupied {
      background: var(--r2);
      border-color: var(--r2);
    }

    .leg .reserved {
      border: 2px dashed var(--warn);
      background: #fffbeb;
    }

    .leg .blocked {
      background: #94a3b8;
      border-color: #64748b;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--bd);
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--r2);
      font-weight: 600;
    }

    .tbl {
      overflow-x: auto;
    }

    #toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      background: var(--r1);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      max-width: 92%;
      display: none;
      z-index: 9;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
      font-size: 14px;
    }

    .msg {
      padding: 10px;
      border-left: 4px solid var(--r3);
      background: var(--r4);
      margin-bottom: 8px;
      font-size: 13px;
      border-radius: 8px;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 90px;
    }

    .bars i {
      flex: 1;
      background: linear-gradient(#60a5fa, #1e5fbf);
      border-radius: 3px 3px 0 0;
      min-height: 2px;
    }

    .badge {
      background: var(--r4);
      color: var(--r2);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid #bfd7f7;
    }

    .hint {
      font-size: 12px;
      color: var(--mut);
    }

    @media(max-width: 700px) {
      #side {
        width: 76px;
        padding: 12px 6px;
      }
      .brand {
        justify-content: center;
        padding: 0;
      }
      .brand b, .who {
        display: none;
      }
      #side nav {
        margin-top: 18px;
      }
      #side button {
        flex-direction: column;
        gap: 4px;
        padding: 10px 2px;
        font-size: 10.5px;
        text-align: center;
        border-left: 0;
        border-radius: 10px;
      }
      #side button svg {
        width: 23px;
        height: 23px;
      }
      .foot button {
        font-size: 10px;
      }
      main {
        padding: 16px 12px 30px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside id="side"></aside>
    <main id="app"></main>
  </div>
  <div id="toast"></div>

  <script>
    // ====== Estado (em memória) ======
    const TOTAL = 50;
    let off = 0;
    const now = () => Date.now() + off;
    const cfg = { rate: 8, pct: 10, base: 'hora', day: 40 };
    const users = [
      { n: 'Ana Cliente', e: 'cliente@demo.com', p: '123', r: 'c', cpf: '123.456.789-00', cars: ['ABC1D23'], msgs: [] },
      { n: 'Carlos Funcionário', e: 'func@demo.com', p: '123', r: 'f', cars: [], msgs: [] },
      { n: 'Admin', e: 'admin@demo.com', p: '123', r: 'a', cars: [], msgs: [] }
    ];
    const spots = Array.from({ length: TOTAL }, (_, i) => ({
      id: i + 1,
      st: 'free',
      type: i < 2 ? 'PCD' : i < 4 ? 'Elétrico' : i < 6 ? 'Moto' : 'Comum'
    }));
    let res = [], sess = [], pay = [], done = [], rlog = [];
    let me = null, tab = '', sel = null, mode = 'in', tmp = null, rep = 'd', selP = null, selH = 1;
    const ico = { free: 'Livre', occupied: 'Ocupada', reserved: 'Reserv.', blocked: 'Bloq.' };
    const $ = s => document.querySelector(s);
    const R = v => 'R$ ' + v.toFixed(2).replace('.', ',');
    const T = t => new Date(t).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
    const spot = id => spots.find(s => s.id == id);
    const cost = (m, min) => m <= 0 ? 0 : Math.max(min ? cfg.rate : 0, Math.ceil(m / 15) * cfg.rate / 4); // mínimo de 1 h na 1ª cobrança
    const base = h => cfg.base == 'hora' ? cfg.rate : cfg.base == 'diaria' ? cfg.day : cfg.rate * h;
    const fee = h => +(base(h) * cfg.pct / 100).toFixed(2);
    const okPlate = p => /^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(p);
    const usr = e => users.find(u => u.e == e);

    function toast(m) {
      const t = $('#toast');
      t.textContent = m;
      t.style.display = 'block';
      clearTimeout(t.h);
      t.h = setTimeout(() => t.style.display = 'none', 4000);
    }

    function note(e, m) {
      const u = usr(e);
      if (u) u.msgs.unshift({ t: now(), m });
      if (me && me.e == e) toast(m);
    }

    // due: valor devido agora (tolerância de 20 min após pagamento; depois cobra excedente)
    function due(s, t = now()) {
      if (s.paidAt && t <= s.paidAt + 20 * 6e4) return 0;
      const start = s.paidAt ? s.paidAt + 20 * 6e4 : s.entry;
      return Math.max(0, cost((t - start) / 6e4, !s.paidAt) - (s.paidAt ? 0 : s.credit));
    }

    // seed de dados
    (function() {
      const rnd = (a, b) => a + Math.random() * (b - a);
      for (let i = 0; i < 40; i++) {
        const d = i < 6 ? 0 : Math.floor(rnd(0, 30));
        const ex = now() - d * 864e5 - rnd(1, 5) * 36e5;
        const m = Math.round(rnd(30, 300));
        done.push({ plate: 'SEED' + i, entry: ex - m * 6e4, exit: ex, mins: m });
        pay.push({ t: ex, type: 'Estacionamento', amt: cost(m, true), plate: 'SEED' + i, user: null });
      }
      for (let i = 0; i < 12; i++) rlog.push({ t: now() - rnd(0, 29) * 864e5, ev: i < 3 ? 'noshow' : 'reserva' });
      ['KLM2N34', 'QWE4R56', 'BRA2E19', 'HJK7L89', 'MNO1P23', 'RTY5U67'].forEach((p, i) => {
        const s = spot(10 + i);
        s.st = 'occupied';
        sess.push({ plate: p, spot: s.id, entry: now() - rnd(10, 150) * 6e4, credit: 0, paidAt: null, staff: 'func@demo.com', user: null });
      });
    })();

    function expire() {
      let ch = false;
      res.filter(r => now() - r.at > 20 * 6e4).forEach(r => {
        res.splice(res.indexOf(r), 1);
        spot(r.spot).st = 'free';
        rlog.push({ t: now(), ev: 'noshow' });
        ch = true;
        note(r.user, 'Reserva da vaga ' + r.spot + ' cancelada por expiração (20 min). A taxa de ' + R(r.fee) + ' não é reembolsável. Reembolso: R$ 0,00.');
      });
      return ch;
    }

    setInterval(() => { if (expire()) render(); }, 5000);

    function adv() {
      off += 15 * 6e4;
      expire();
      render();
      toast('Relógio simulado +15 min');
    }

    // ====== Ações ======
    function login() {
      const u = users.find(u => u.e == $('#le').value.trim() && u.p == $('#lp').value);
      if (!u) return toast('E-mail ou senha inválidos');
      me = u;
      tab = { c: 'home', f: 'in', a: 'rel' }[u.r];
      render();
    }

    function demo(e) {
      $('#le').value = e;
      $('#lp').value = '123';
      login();
    }

    function signup() {
      const n = $('#sn').value.trim(), e = $('#se').value.trim(), p = $('#sp').value, c = $('#sc').value.trim(), pl = $('#spl').value.toUpperCase().trim();
      if (!n || !e || !p || !c) return toast('Preencha todos os campos');
      if (!okPlate(pl)) return toast('Placa inválida (ex.: ABC1234 ou ABC1D23)');
      if (usr(e)) return toast('E-mail já cadastrado');
      users.push({ n, e, p, r: 'c', cpf: c, cars: [pl], msgs: [] });
      toast('Conta criada! Faça login.');
      lg = 'in';
      render();
    }

    function out() {
      me = null;
      sel = null;
      render();
    }

    function setTab(t) {
      tab = t;
      tmp = null;
      render();
    }

    function clickSpot(id) {
      const s = spot(id);
      if (me.r == 'c') {
        if (s.st != 'free') return toast('Vaga ' + id + ': ' + ico[s.st]);
        if (mine().res || mine().ses) return toast('Você já tem reserva/vaga ativa');
        sel = id;
      } else {
        if (s.st == 'free') s.st = 'blocked';
        else if (s.st == 'blocked') s.st = 'free';
        else return toast('Vaga em uso/reservada');
      }
      render();
    }

    const mine = () => ({ res: res.find(r => r.user == me.e), ses: sess.find(s => s.user == me.e) });

    function reserve() {
      const p = selP || me.cars[0], h = selH;
      if (sess.find(s => s.plate == p) || res.find(r => r.plate == p)) return toast('Placa já possui reserva/vaga ativa');
      const f = fee(h);
      res.push({ id: now(), plate: p, spot: sel, at: now(), fee: f, user: me.e });
      spot(sel).st = 'reserved';
      pay.push({ t: now(), type: 'Taxa de reserva', amt: f, plate: p, user: me.e });
      rlog.push({ t: now(), ev: 'reserva' });
      note(me.e, 'Reserva confirmada: vaga ' + sel + ' para ' + p + '. Taxa ' + R(f) + ' paga. Chegue em até 20 min.');
      sel = null;
      selP = null;
      selH = 1;
      tab = 'mine';
      render();
    }

    function cancelRes() {
      const r = mine().res;
      res.splice(res.indexOf(r), 1);
      spot(r.spot).st = 'free';
      rlog.push({ t: now(), ev: 'cancel' });
      note(me.e, 'Reserva cancelada. A taxa de ' + R(r.fee) + ' não é reembolsável (regra do estacionamento). Reembolso: R$ 0,00.');
      render();
    }

    function payNow() {
      const s = mine().ses, v = due(s);
      if (v <= 0) return toast('Nada a pagar agora');
      pay.push({ t: now(), type: 'Estacionamento', amt: v, plate: s.plate, user: me.e });
      s.paidAt = now();
      note(me.e, 'Pagamento de ' + R(v) + ' confirmado (Pix simulado). Você tem 20 min de tolerância para sair.');
      render();
    }

    function addCar() {
      const p = $('#nc').value.toUpperCase().trim();
      if (!okPlate(p)) return toast('Placa inválida');
      if (me.cars.includes(p)) return toast('Placa já cadastrada');
      me.cars.push(p);
      render();
    }

    function entry() {
      const p = $('#ep').value.toUpperCase().trim();
      if (!okPlate(p)) return toast('Placa inválida');
      if (sess.find(s => s.plate == p)) return toast('Placa já está ativa em outra vaga (duplicidade)');
      const r = res.find(r => r.plate == p);
      let id = r ? r.spot : +$('#es').value;
      if (!id) return toast('Escolha uma vaga');
      if (!r && spot(id).st != 'free') return toast('Vaga indisponível');
      if (r) res.splice(res.indexOf(r), 1);
      spot(id).st = 'occupied';
      sess.push({
        plate: p,
        spot: id,
        entry: now(),
        credit: r ? r.fee : 0,
        paidAt: null,
        staff: me.e,
        user: r ? r.user : (users.find(u => u.cars.includes(p)) || {}).e || null
      });
      toast('Entrada registrada: ' + p + ' → vaga ' + id + (r ? ' (reserva)' : ''));
      render();
    }

    function findOut() {
      const p = $('#xp').value.toUpperCase().trim();
      const s = sess.find(s => s.plate == p);
      if (!s) return toast('Placa não encontrada no pátio');
      tmp = s;
      render();
    }

    function exitCar() {
      const s = tmp, v = due(s);
      if (v > 0) pay.push({ t: now(), type: s.paidAt ? 'Excedente' : 'Estacionamento', amt: v, plate: s.plate, user: s.user });
      done.push({ plate: s.plate, entry: s.entry, exit: now(), mins: Math.round((now() - s.entry) / 6e4) });
      sess.splice(sess.indexOf(s), 1);
      spot(s.spot).st = 'free';
      tmp = null;
      toast('Cancela liberada (simulação). Saída de ' + s.plate + (v > 0 ? ' – cobrado ' + R(v) : ' – sem pendências'));
      render();
    }

    function saveCfg() {
      cfg.rate = +$('#cr').value;
      cfg.pct = +$('#cp').value;
      cfg.base = $('#cb').value;
      cfg.day = +$('#cd').value;
      toast('Configurações salvas');
      render();
    }

    // ====== Views ======
    let lg = 'in';

    function mapHtml() {
      return '<div class="grid">' + spots.map(s => '<div class="sp ' + s.st + (sel == s.id ? ' sel' : '') + '" onclick="clickSpot(' + s.id + ')"><b>' + s.id + '</b>' + ico[s.st] + '<small>' + (s.type == 'Comum' ? '&nbsp;' : s.type) + '</small></div>').join('') + '</div><div class="leg"><span><u class="free"></u>Livre</span><span><u class="occupied"></u>Ocupada</span><span><u class="reserved"></u>Reservada</span><span><u class="blocked"></u>Bloqueada</span></div>';
    }

    const cnt = () => spots.filter(s => s.st == 'free').length;
    const IC = {
      home: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
      mine: '<path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2"/>',
      hist: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
      in: '<path d="M3 12h12"/><path d="M11 6l6 6-6 6"/><path d="M21 4v16"/>',
      out: '<path d="M21 12H9"/><path d="M13 6l-6 6 6 6"/><path d="M3 4v16"/>',
      patio: '<path d="M5 15l1.5-5a2 2 0 0 1 2-1.5h7a2 2 0 0 1 2 1.5L19 15"/><rect x="3" y="15" width="18" height="5" rx="1.5"/><circle cx="7.5" cy="17.5" r=".8"/><circle cx="16.5" cy="17.5" r=".8"/>',
      rel: '<path d="M5 20V11"/><path d="M12 20V4"/><path d="M19 20v-6"/><path d="M2 20h20"/>',
      cfg: '<path d="M3 6h9"/><path d="M18 6h3"/><circle cx="15" cy="6" r="2.5"/><path d="M3 12h3"/><path d="M12 12h9"/><circle cx="9" cy="12" r="2.5"/><path d="M3 18h11"/><path d="M20 18h1"/><circle cx="17" cy="18" r="2.5"/>',
      ff: '<path d="M4 5l7 7-7 7z"/><path d="M13 5l7 7-7 7z"/>',
      exit: '<path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/>'
    };

    const svg = k => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + IC[k] + '</svg>';
    let NAV = [];
    
    function tabs(list) {
      NAV = list;
      return '';
    }

    function side() {
      return '<div class="brand"><span class="logo">P</span><b>Parkly</b></div><nav>' + NAV.map(([k, l]) => '<button class="' + (tab == k ? 'on' : '') + '" onclick="setTab(\'' + k + '\')">' + svg(k) + '<span>' + l + '</span></button>').join('') + '</nav><div class="foot"><div class="who"><b>' + me.n + '</b><small>' + ({ c: 'Cliente', f: 'Funcionário', a: 'Administrador' })[me.r] + '</small><small>' + T(now()) + '</small></div><button onclick="adv()">' + svg('ff') + '<span>Avançar 15 min</span></button><button onclick="out()">' + svg('exit') + '<span>Sair</span></button></div>';
    }

    function vLogin() {
      return '<div class="card" style="max-width:420px;margin:30px auto"><h2>Parkly</h2><div class="tabs"><button class="' + (lg == 'in' ? 'on' : '') + '" onclick="lg=\'in\';render()">Entrar</button><button class="' + (lg == 'up' ? 'on' : '') + '" onclick="lg=\'up\';render()">Criar conta</button></div>' +
        (lg == 'in' ? '<label>E-mail</label><input id="le" type="email"><label>Senha</label><input id="lp" type="password"><button onclick="login()" style="width:100%">Entrar</button><p class="hint">Acesso rápido de demonstração:</p><button class="g" onclick="demo(\'cliente@demo.com\')">Cliente</button> <button class="g" onclick="demo(\'func@demo.com\')">Funcionário</button> <button class="g" onclick="demo(\'admin@demo.com\')">Administrador</button>' :
        '<label>Nome</label><input id="sn"><label>E-mail</label><input id="se" type="email"><label>Senha</label><input id="sp" type="password"><label>CPF</label><input id="sc"><label>Placa do veículo</label><input id="spl" maxlength="7"><button onclick="signup()" style="width:100%">Criar conta</button>') + '</div>';
    }

    function vClient() {
      const m = mine();
      let h = tabs([['home', 'Vagas', ''], ['mine', 'Minha vaga', ''], ['hist', 'Histórico', ''], ['perfil', 'Perfil', '']]);
      if (tab == 'home') {
        h += '<div class="row"><div class="stat"><b>' + cnt() + ' / ' + TOTAL + '</b>vagas disponíveis</div><div class="stat"><b>' + R(cfg.rate) + '/h</b>fração de 15 min · mínimo 1 h · reserva ' + cfg.pct + '%</div></div><div class="card" style="margin-top:14px"><h2>Mapa do estacionamento</h2>' + mapHtml() + '</div>';
        if (sel) {
          h += '<div class="card"><h2>Reservar vaga ' + sel + '</h2><label>Veículo</label><select id="rp" onchange="selP=this.value;render()">' + me.cars.map(c => '<option' + (c == (selP || me.cars[0]) ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' + (cfg.base == 'estimado' ? '<label>Tempo estimado (mínimo 1 h)</label><select id="rh" onchange="selH=+this.value;render()">' + [1, 2, 3, 4, 6, 8].map(x => '<option' + (x == selH ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>' : '') + '<p>Taxa de reserva: <b id="fv">' + R(fee(selH)) + '</b> (abatida do total se usar a vaga; <b>não reembolsável</b> em caso de cancelamento).</p><button onclick="reserve()">Pagar taxa e reservar</button> <button class="g" onclick="sel=null;render()">Cancelar</button></div>';
        } else {
          h += '<p class="hint">Toque em uma vaga livre para reservar.</p>';
        }
      }
      if (tab == 'mine') {
        if (m.res) {
          const left = Math.max(0, Math.ceil((m.res.at + 20 * 6e4 - now()) / 6e4));
          h += '<div class="card"><h2>Reserva ativa</h2><p>Vaga <b>' + m.res.spot + '</b> · ' + m.res.plate + '<br>Expira em <b>' + left + ' min</b> · taxa paga ' + R(m.res.fee) + '</p><button onclick="cancelRes()">Cancelar reserva</button></div>';
        }
        if (m.ses) {
          const s = m.ses, mins = Math.round((now() - s.entry) / 6e4);
          h += '<div class="card"><h2>Seu veículo está na vaga ' + s.spot + '</h2><p>' + s.plate + ' · entrada ' + T(s.entry) + ' · ' + mins + ' min estacionado<br>Crédito da reserva: ' + R(s.credit) + '<br>' + (s.paidAt && now() <= s.paidAt + 20 * 6e4 ? 'Pago. Saída liberada até ' + T(s.paidAt + 20 * 6e4) : 'Valor a pagar agora: <b>' + R(due(s)) + '</b>') + '</p><button onclick="payNow()">Pagar pelo app (Pix simulado)</button><p class="hint">Após o pagamento você tem 20 min de tolerância; depois disso o tempo excedente é cobrado.</p></div>';
        }
        if (!m.res && !m.ses) h += '<div class="card">Você não tem reserva nem veículo estacionado.</div>';
      }
      if (tab == 'hist') {
        h += '<div class="card"><h2>Mensagens</h2>' + (me.msgs.map(x => '<div class="msg"><small>' + T(x.t) + '</small><br>' + x.m + '</div>').join('') || '<p class="hint">Sem mensagens.</p>') + '</div><div class="card"><h2>Pagamentos</h2><div class="tbl"><table><tr><th>Data</th><th>Tipo</th><th>Placa</th><th>Valor</th></tr>' + pay.filter(p => p.user == me.e).reverse().map(p => '<tr><td>' + T(p.t) + '</td><td>' + p.type + '</td><td>' + p.plate + '</td><td>' + R(p.amt) + '</td></tr>').join('') + '</table></div></div>';
      }
      if (tab == 'perfil') {
        h += '<div class="card"><h2>Perfil</h2><p><b>' + me.n + '</b><br>' + me.e + '<br>CPF: ' + me.cpf + '</p><h2>Meus veículos</h2><p>' + me.cars.map(c => '<span class="badge">' + c + '</span> ').join('') + '</p><label>Adicionar placa</label><input id="nc" maxlength="7"><button onclick="addCar()">Adicionar</button></div>';
      }
      return h;
    }

    function patio() {
      return '<div class="card"><h2>Veículos no pátio (' + sess.length + ')</h2><input placeholder="Buscar por placa" oninput="q=this.value.toUpperCase();render();this.focus()" value="' + q + '"><div class="tbl"><table><tr><th>Placa</th><th>Vaga</th><th>Entrada</th><th>Pago até</th><th>A pagar</th></tr>' + sess.filter(s => s.plate.includes(q)).map(s => '<tr><td>' + s.plate + '</td><td>' + s.spot + '</td><td>' + T(s.entry) + '</td><td>' + (s.paidAt ? T(s.paidAt + 20 * 6e4) : '—') + '</td><td>' + R(due(s)) + '</td></tr>').join('') + '</table></div></div><div class="card"><h2>Reservas (' + res.length + ')</h2>' + (res.map(r => '<p>' + r.plate + ' · vaga ' + r.spot + ' · expira ' + T(r.at + 20 * 6e4) + '</p>').join('') || '<p class="hint">Nenhuma.</p>') + '</div><div class="card"><h2>Vagas (toque numa livre/bloqueada para bloquear/liberar)</h2>' + mapHtml() + '</div>';
    }

    let q = '';

    function vStaff() {
      let h = tabs([['in', 'Entrada', ''], ['out', 'Saída', ''], ['patio', 'Pátio', '']]);
      if (tab == 'in') {
        const free = spots.filter(s => s.st == 'free');
        h += '<div class="card"><h2>Registrar entrada (manual)</h2><label>Placa</label><input id="ep" maxlength="7" placeholder="ABC1D23"><label>Vaga (ignorada se houver reserva para a placa)</label><select id="es">' + free.map(s => '<option value="' + s.id + '">' + s.id + ' – ' + s.type + '</option>').join('') + '</select><button onclick="entry()">Registrar entrada</button></div>';
      }
      if (tab == 'out') {
        h += '<div class="card"><h2>Registrar saída</h2><label>Placa</label><input id="xp" maxlength="7" value="' + (tmp ? tmp.plate : '') + '"><button onclick="findOut()">Buscar</button>';
        if (tmp) {
          const s = tmp, v = due(s);
          h += '<p style="margin-top:12px">Vaga <b>' + s.spot + '</b> · entrada ' + T(s.entry) + ' · ' + Math.round((now() - s.entry) / 6e4) + ' min<br>Situação: ' + (s.paidAt ? (now() <= s.paidAt + 20 * 6e4 ? 'pago, dentro da tolerância' : 'pago, tolerância excedida') : 'não pago') + '<br>Valor a cobrar: <b>' + R(v) + '</b></p><button onclick="exitCar()">' + (v > 0 ? 'Cobrar excedente e ' : '') + 'Liberar cancela (simulada)</button>';
        }
        h += '</div>';
      }
      if (tab == 'patio') h += patio();
      return h;
    }

    function vAdmin() {
      let h = tabs([['rel', 'Relatórios', ''], ['cfg', 'Ajustes', ''], ['patio', 'Pátio', '']]);
      if (tab == 'rel') {
        const st = rep == 'd' ? new Date(now()).setHours(0, 0, 0, 0) : now() - 30 * 864e5;
        const P = pay.filter(p => p.t >= st), D = done.filter(d => d.exit >= st), L = rlog.filter(l => l.t >= st);
        const fat = P.reduce((a, p) => a + p.amt, 0), avg = D.length ? Math.round(D.reduce((a, d) => a + d.mins, 0) / D.length) : 0, hrs = Array(24).fill(0);
        D.forEach(d => hrs[new Date(d.entry).getHours()]++);
        const mx = Math.max(...hrs, 1);
        h += '<div class="tabs"><button class="' + (rep == 'd' ? 'on' : '') + '" onclick="rep=\'d\';render()">Diário</button><button class="' + (rep == 'm' ? 'on' : '') + '" onclick="rep=\'m\';render()">Mensal (30 dias)</button></div><div class="row"><div class="stat"><b>' + R(fat) + '</b>faturamento</div><div class="stat"><b>' + Math.round(sess.length * 100 / TOTAL) + '%</b>ocupação agora</div><div class="stat"><b>' + avg + ' min</b>permanência média</div><div class="stat"><b>' + L.filter(l => l.ev == 'reserva').length + '</b>reservas</div><div class="stat"><b>' + L.filter(l => l.ev == 'noshow').length + '</b>no-shows</div><div class="stat"><b>' + D.length + '</b>estacionamentos concluídos</div></div><div class="card" style="margin-top:14px"><h2>Horários de pico (entradas por hora)</h2><div class="bars">' + hrs.map((v, i) => '<i title="' + i + 'h: ' + v + '" style="height:' + v * 100 / mx + '%"></i>').join('') + '</div><div class="hint">0h → 23h</div></div><p class="hint">Dados anteriores a hoje são fictícios (seed de demonstração).</p>';
      }
      if (tab == 'cfg') {
        h += '<div class="card"><h2>Preços e regras</h2><label>Valor da hora (R$)</label><input id="cr" type="number" step="0.5" value="' + cfg.rate + '"><label>Valor da diária (R$)</label><input id="cd" type="number" value="' + cfg.day + '"><label>Taxa de reserva (%)</label><input id="cp" type="number" value="' + cfg.pct + '"><label>Base de cálculo da taxa (a decidir com a equipe)</label><select id="cb">' + [['hora', '1 hora'], ['diaria', 'Diária'], ['estimado', 'Tempo estimado pelo cliente']].map(o => '<option value="' + o[0] + '"' + (cfg.base == o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select><button onclick="saveCfg()">Salvar</button></div>';
      }
      if (tab == 'patio') h += patio();
      return h;
    }

    function render() {
      const body = !me ? vLogin() : me.r == 'c' ? vClient() : me.r == 'f' ? vStaff() : vAdmin();
      document.body.classList.toggle('auth', !me);
      $('#side').innerHTML = me ? side() : '';
      $('#app').innerHTML = body;
    }

    render();
  </script>
</body>
</html>
